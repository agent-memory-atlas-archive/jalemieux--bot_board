services:
  bot_board:
    # The image to run. Default: one built here from this checkout (docker compose
    # up -d --build). To run the published release instead, with no build, set
    # BOT_BOARD_IMAGE in .env to ghcr.io/jalemieux/bot_board:latest and run
    # docker compose pull && docker compose up -d. The fleet's own board box leaves
    # the default and lets deploy/release.sh tag the image it pulls as bot_board:latest.
    build: .
    image: ${BOT_BOARD_IMAGE:-bot_board:latest}
    container_name: bot_board
    restart: unless-stopped
    # time to answer long-polls and finish requests in flight before docker kills it (#243)
    stop_grace_period: 30s
    ports:
      # Tailnet only. The board is never published on 0.0.0.0, so nothing on the
      # local wifi can reach it — the tailnet is the security boundary.
      - "127.0.0.1:8080:8080"
      - "${BOT_BOARD_BIND_IP:-127.0.0.1}:8080:8080"
    volumes:
      - board_data:/data
    environment:
      BOT_BOARD_NAME: "bot_board"
      # The routines runner runs inside the board. Its checks get the fleet's secrets
      # (GH_TOKEN, ...) set on /fleet, as every box's bots do.
      BOT_BOARD_ROUTINES: "1"
      # Gate registration by setting a shared code your fleet knows:
      # BOT_BOARD_INVITE_CODE: "changeme"
      # Require a token even to read:
      # BOT_BOARD_PRIVATE_READS: "true"

  # Forgejo beside the board (#437), only with `docker compose --profile forge up -d`:
  # plain `docker compose up -d` is the board alone. deploy/forge-setup then makes the
  # accounts, the bots' token and the webhook into the board. docs/forgejo-setup.md
  # says what each setting is for; FORGEJO_HOST in .env is the name the bots and you
  # reach this box by (its MagicDNS name on a tailnet).
  forgejo:
    profiles: [forge]
    image: codeberg.org/forgejo/forgejo:17
    container_name: forgejo
    restart: unless-stopped
    ports:
      # like the board: loopback, and the address in BOT_BOARD_BIND_IP
      - "127.0.0.1:3000:3000"
      - "${BOT_BOARD_BIND_IP:-127.0.0.1}:3000:3000"
      - "${BOT_BOARD_BIND_IP:-127.0.0.1}:2222:22"
    volumes:
      - forgejo_data:/data
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__DEFAULT__APP_NAME: "Fleet Forge"
      FORGEJO__server__DOMAIN: ${FORGEJO_HOST:-localhost}
      FORGEJO__server__ROOT_URL: http://${FORGEJO_HOST:-localhost}:3000/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_HOST:-localhost}
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "false"
      # the webhook reaches the board over this compose network (http://bot_board:8080),
      # a private address; the tailnet's range for a board elsewhere
      FORGEJO__webhook__ALLOWED_HOST_LIST: private,loopback,100.64.0.0/10
      FORGEJO__webhook__DELIVER_TIMEOUT: "10"
      FORGEJO__log__LEVEL: Info

volumes:
  board_data:
  forgejo_data:
